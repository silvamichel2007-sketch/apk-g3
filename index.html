<script>
const $=id=>document.getElementById(id);
let photos=[], currentId=null, records=[];
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function addItem(desc='',val='0'){
 const row=document.createElement('div');row.className='item';
 row.innerHTML='<div><label>Descrição</label><input class="desc" placeholder="Peça, serviço ou mão de obra"></div><div><label>Valor (R$)</label><input class="value" type="number" min="0" step=".01"></div><button type="button" class="danger no-print" aria-label="Remover">×</button>';
 row.querySelector('.desc').value=desc;row.querySelector('.value').value=val;
 row.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
 row.querySelector('button').onclick=()=>{row.remove();calc()};
 $('items').appendChild(row);calc();
}

function calc(){let sum=[...document.querySelectorAll('.value')].reduce((a,e)=>a+(Number(e.value)||0),0);let total=Math.max(0,sum-(Number($('desconto').value)||0));$('total').textContent=money(total);return total}
$('addItem').onclick=()=>addItem();
$('desconto').oninput=calc;

$('fotos').onchange=async e=>{for(const file of e.target.files){if(!file.type.startsWith('image/'))continue;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});photos.push({name:file.name,caption:file.name,data});}renderPhotos();e.target.value=''};

function renderPhotos(){const g=$('photoGrid');g.innerHTML='';photos.forEach((ph,i)=>{const d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${ph.data}" alt=""><label>Legenda</label><input value="${escapeHtml(ph.caption)}" data-i="${i}"><button class="danger no-print" data-del="${i}" style="margin-top:5px">Remover</button>`;g.appendChild(d)});g.querySelectorAll('input').forEach(e=>e.oninput=()=>photos[Number(e.dataset.i)].caption=e.value);g.querySelectorAll('button').forEach(e=>e.onclick=()=>{photos.splice(Number(e.dataset.del),1);renderPhotos()})}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const fields=['cliente','telefone','veiculo','ano','placa','km','relato','diagnostico','recomendacao','desconto','validade','status','garantia'];

function collect(){return {id:currentId||String(Date.now()),date:new Date().toLocaleString('pt-BR'),fields:Object.fromEntries(fields.map(f=>[f,$(f).value])),items:[...document.querySelectorAll('.item')].map(r=>({desc:r.querySelector('.desc').value,value:r.querySelector('.value').value})),photos,total:calc()}}

function apply(r){currentId=r.id;fields.forEach(f=>$(f).value=r.fields[f]||'');$('items').innerHTML='';(r.items||[]).forEach(i=>addItem(i.desc,i.value));photos=r.photos||[];renderPhotos();calc();$('notice').textContent='Orçamento carregado.'}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('OrcamentoOficinaDB',1);req.onupgradeneeded=()=>req.result.createObjectStore('orcamentos',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

async function saveRecord(){const r=collect();const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('orcamentos','readwrite');tx.objectStore('orcamentos').put(r);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});currentId=r.id;$('notice').textContent='Orçamento salvo neste aparelho.';await loadRecords()}

function normalizePlate(value){return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}

function renderRecords(){
 const list=$('savedList');list.innerHTML='';
 const query=normalizePlate($('searchPlate').value);
 const matches=records.filter(r=>!query||normalizePlate(r.fields?.placa).includes(query));
