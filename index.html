<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<title>Orçamento Oficina</title>
<style>
:root{--navy:#17324d;--blue:#176b87;--bg:#f3f6f8;--line:#d7e0e6;--muted:#617381}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17232d}
header{max-width:850px;margin:14px auto 0;background:var(--navy);color:white;padding:12px 18px;border-radius:12px}
.header-layout{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px}
.header-info{min-width:0}
header h1{margin:0;font-size:21px}
header p{margin:3px 0 0;color:#d6e3eb;font-size:12px}
.pix-header{display:flex;align-items:center;gap:10px;margin:0;color:#fff;font-size:11px;line-height:1.3;max-width:330px}
.pix-header img{width:94px;height:94px;flex:0 0 94px;background:#fff;padding:5px;border-radius:6px;object-fit:contain}
.pix-header strong{font-size:13px}
@media(max-width:560px){header{margin:8px 8px 0;padding:12px}.header-layout{grid-template-columns:1fr;gap:10px}.pix-header{max-width:none;justify-content:flex-start}.pix-header img{width:82px;height:82px;flex-basis:82px}}
@media print{header{max-width:none;margin:0 0 10px;border-radius:0;padding:10px 13px}.header-layout{grid-template-columns:minmax(0,1fr) auto;gap:12px}.pix-header{max-width:290px;font-size:8pt}.pix-header img{width:76px;height:76px;flex-basis:76px}.pix-header span{font-size:8pt}header p{font-size:8pt;margin:2px 0 0}}
main{max-width:850px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px #17324d0b}
h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
input,textarea,select{width:100%;border:1px solid #cbd6dd;border-radius:9px;padding:11px;font:inherit;background:white;color:#17232d}
textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:650;background:var(--navy);color:white;font-size:14px;cursor:pointer}
button.secondary{background:#e8eff3;color:var(--navy)}button.danger{background:#fff0ef;color:#a52c25}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:1fr 110px 42px;gap:8px;align-items:end;margin:8px 0}
.total{font-size:25px;font-weight:800;color:#13734e}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px;margin-top:10px}
.photo{border:1px solid var(--line);border-radius:9px;padding:6px;font-size:11px;overflow:hidden}
.photo img{width:100%;height:95px;object-fit:cover;border-radius:6px}
.saved{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.saved strong{display:block}.hidden{display:none}
#notice{font-size:12px;color:#13734e;min-height:18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr 95px 38px}}
@media print{
 @page{size:A4;margin:14mm 13mm}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 body{background:#fff!important;color:#17232d;font-size:11pt;line-height:1.4}
 header{display:block!important;background:#17324d!important;color:#fff!important;padding:15px 18px!important;margin:0 0 13px;border-radius:0}
 header h1{font-size:21pt;letter-spacing:.2px;margin:0 0 3px}
 header p{color:#e2edf3!important;margin:2px 0;font-size:9pt}
 .no-print,#savedCard{display:none!important}
 main{max-width:none;padding:0;margin:0;display:block}
 .card{background:#fff!important;border:0;border-bottom:1.5px solid #9aaab5!important;border-radius:0!important;box-shadow:none!important;padding:12px 2px 14px!important;margin:0 0 8px!important;break-inside:auto;page-break-ins
